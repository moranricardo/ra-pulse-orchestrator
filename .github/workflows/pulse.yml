name: Executar Ra Pulse Orchestrator

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-orchestrator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Orquestador
        uses: actions/checkout@v3

      - name: Checkout IA Didáctica Core
        uses: actions/checkout@v3
        with:
          repository: moranricardo/ia-didactica-core
          path: ia-didactica-core

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Ejecutar Análisis de Parches
        run: node test_pulse.mjs
